[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-interview-backend"
version = "0.1.0"
description = "FastAPI backend skeleton for an AI interview MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20,<1",
    "asyncpg>=0.30,<1",
    "boto3>=1.35,<2",
    "certifi>=2024.12",
    "fastapi>=0.115,<1",
    "faster-whisper>=1.1,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.18,<1",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "urllib3>=2.2,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/interview_api"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["pytest-temp-*", ".pytest-case-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
